{
 "_comment": "Conductor config \u2014 JSON syntax (valid YAML 1.2) so python stdlib json.load can read it. Free-tier models ONLY: dev runs must never burn Groq quota, Go, or paid models. Pings use each session's own configured model.",
 "tick_s": 15,
 "debounce_s": 75,
 "max_parallel_runs": 3,
 "runs_per_hour": 12,
 "run_timeout_s": 2700,
 "max_consecutive_failures": 3,
 "stall_heartbeat_s": 1200,
 "failure_backoff_base_s": 30,
 "failure_backoff_max_s": 900,
 "model": "opencode-go/mimo-v2.5",
 "dry_run": false,
 "api_check": true,
 "priority": [
  "infra",
  "router",
  "brain-core",
  "orb",
  "voice",
  "pc-control",
  "computer-use",
  "qa-security",
  "tools-memory",
  "evolution-persona"
 ],
 "start_conditions": {
  "tools-memory": {
   "min_wave": 3
  },
  "evolution-persona": {
   "min_wave": 4
  }
 },
 "live_gate_waves": [
  2
 ],
 "repo_root": "/home/dami/raphael",
 "wt_root": "/home/dami/raphael-wt",
 "integrator_cwd": "/home/dami/raphael",
 "_integrator_wake": "PRIMARY = ping the registered integrator session (idle at zero cost, context kept); the headless run below is only the FALLBACK when no session exists",
 "integrator_ping_msg": "coord wake: {pending} unread coord event(s). Handle them per ~/.raphael-coord/prompts/integrator_event.md (read state.json + your inbox, process events, advance cursors, reply decisions), then go idle. Idempotent: nothing new = say so and end your turn.",
 "integrator_cmd": [
  "opencode",
  "run",
  "--auto",
  "--format",
  "json",
  "--model",
  "{model}",
  "--title",
  "coord-integrator-event",
  "--file",
  "{prompt}",
  "Handle the unread Raphael coord events per the attached protocol. Files are your memory. If nothing needs handling, exit immediately."
 ],
 "integrator_prompt": "prompts/integrator_event.md",
 "lane_headless_cmd": [
  "opencode",
  "run",
  "--auto",
  "--format",
  "json",
  "--model",
  "{model}",
  "--title",
  "coord-{lane}-continue",
  "--file",
  "{prompt}",
  "Continue your lane work loop per the attached instructions."
 ],
 "lane_prompt": "prompts/lane_continue.md",
 "ping_msg": "coord wake: read ~/.raphael-coord/inbox/{lane}.jsonl (your inbox) and ~/.raphael-coord/prompts/lane_continue.md, then continue your work loop from docs/WAVES.md + docs/lanes/{lane}.md. Rebase on main first. Report via coord.",
 "sweep_s": 600,
 "_sweep": "stranded-lane backstop: adopted + wave-active + empty inbox + no pending events -> board-review wake",
 "_model_note": "user directive 2026-10-06: Go models for anything needing an LLM (nothing local until RAM upgrade)",
 "wake_grace_s": 600,
 "_guard_note": "patient loop guard: grace per wake attempt, 1 re-ping, then escalate (interactive turns take minutes)"
}