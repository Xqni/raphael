# CI-heavy — the cloud test battery (keeps the laptop free, user mandate 2026-10-07)
#
# Philosophy: the laptop runs ONLY the smallest target while iterating
# (AGENT_RULES rule 14). Every heavy sweep — full-brain, full-root, multi-suite
# verification, orb npm gates — runs HERE on demand:
#     gh workflow run tests-heavy.yml
# Lanes/integrator: verify big changes with this workflow instead of local
# pytest batteries. push/PR stays on ci.yml (fast per-commit signal).
name: tests-heavy

# SEC-7 CI side (qa-security): least privilege + no persisted credentials.
permissions:
  contents: read

on:
  workflow_dispatch:          # manual: gh workflow run tests-heavy.yml
    inputs:
      record_golden:
        type: boolean
        default: false
        description: >-
          Re-record tests/golden/transcripts (GOLDEN_RECORD=1) and upload them
          as an artifact for review before committing (QA-3 capture path).
  schedule:
    - cron: '0 6 * * 1'       # weekly Monday full sweep (cloud minutes, not laptop)
    - cron: '0 5 * * *'       # QA-3 nightly: full mock battery + golden evals

jobs:
  full-battery:
    name: Full battery (all suites, one runner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install (no secrets)
        run: python -m pip install --upgrade pip && pip install -r tests/requirements.txt
      - name: root + supervisor (tests/run_all)
        env: { RAPHAEL_INSTANCE: qa-security }
        run: tests/run_all
      - name: full brain dir (pytest brain — the 738-test import-hygiene/order battery)
        env: { RAPHAEL_INSTANCE: qa-security }
        run: python -m pytest -q brain
      - name: conformance + contract (explicit, both directions)
        env: { RAPHAEL_INSTANCE: qa-security }
        run: python -m pytest -q tests/conformance tests/contract tests/regression tests/resilience
      - name: golden-transcript evals (persona format + tool-call accuracy)
        env: { RAPHAEL_INSTANCE: qa-security }
        run: python -m pytest -q tests/golden
      - name: core guard
        run: python tests/core_guard.py
      - name: capture goldens for review (dispatch input only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.record_golden }}
        env: { RAPHAEL_INSTANCE: qa-security }
        run: |
          GOLDEN_RECORD=1 python -m pytest -q tests/golden
          git -C . diff --stat -- tests/golden || true
      - name: upload captured transcripts (review before commit)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.record_golden }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-transcripts
          path: tests/golden/transcripts/
          if-no-files-found: error

  orb-gates:
    name: Orb npm gates (node only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: body/orb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: body/orb/package-lock.json
      - name: Install (electron skip — gates are pure node)
        run: npm ci --ignore-scripts
      - name: state-machine + orb-diff + wasm-free gates
        run: npm test
