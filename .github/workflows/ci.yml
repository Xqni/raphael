# CI — mock suites only; secrets NEVER required (AGENT_RULES §7).
#
# ubuntu job  = brain suite + qa-security mock harness (contract, regression,
#               security, ownership) — everything runs against mocks, no
#               network providers, no GPU, no live stack.
# windows job = Body unit tests (lock/hotkey envelope) + conformance, no GUI.
#
# Local equivalent:  tests/run_all --with-brain   (Ubuntu)
#                    tests\run_all.ps1            (Windows)
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Windows-first conformance line (integrator glue d9915fc: cp1252 decode of
  # the UTF-8 PROTOCOL marker red-flagged every push while Ubuntu stayed
  # green — this matrix runs the docs-parsing conformance on BOTH OSes as a
  # small, fast, unmistakable signal; Windows catches what Linux can't).
  conformance:
    name: Protocol conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install suite deps (no secrets)
        shell: bash
        run: python -m pip install --upgrade pip && pip install -r tests/requirements.txt
      - name: Conformance (PROTOCOL docs parsers — encoding-sensitive)
        run: python -m pytest -q tests/conformance

  brain-and-mocks:
    name: Ubuntu — brain + mock suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ownership checker diffs against the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install suite deps (no secrets)
        run: python -m pip install --upgrade pip && pip install -r tests/requirements.txt
      - name: qa-security mock suite (contract + regression + security + harness)
        # tests/run_all runs the documented root command:
        #   pytest -q tests supervisor/tests
        # supervisor/tests (infra, ~30 synthetic tests) is collected whenever
        # present — coord decision 2026-10-06 (infra APPROVED, qa-security
        # owns the timing); merge order puts infra's landing before ours, so
        # it exists at integration time.
        env:
          RAPHAEL_INSTANCE: qa-security
        run: tests/run_all
      - name: brain suite (brain/tests + brain/router/tests) on mocks
        env:
          RAPHAEL_INSTANCE: qa-security
        run: python -m pytest -q brain/tests brain/router/tests
      - name: full brain suite (import-hygiene + order-dependent guards)
        # catches the classes unit runs can't: the tools.* double-import
        # registry pollution (e16ca0f) and cross-suite state leaks — the
        # same reason the Windows conformance line exists.
        env:
          RAPHAEL_INSTANCE: qa-security
        run: python -m pytest -q brain
      - name: ownership self-check (lane-derived vs OWNERSHIP.md)
        # Lane derivation (coord decision 2026-10-07 — hardcoding
        # `--lane qa-security` broke every non-qa push; evidence run
        # 37574556616 flagged PROGRESS.md/brain/router on a main push):
        #   - PR head / push ref = agent/<lane>  -> --lane <lane>  (per-lane gate)
        #   - main, integrator pushes, anything else -> --lane integrator
        #     (--lane integrator passes BY DESIGN: the integrator owns all
        #      merges; real per-lane enforcement runs in the integrator's
        #      merge loop per prompts/integrator_event.md)
        run: |
          REF="${{ github.head_ref || github.ref_name }}"
          case "$REF" in
            agent/*) LANE="${REF#agent/}" ;;
            *)       LANE="integrator" ;;
          esac
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            if [ "$REF" = "main" ]; then
              BASE="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
            else
              BASE="$(git merge-base HEAD origin/main 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
            fi
          fi
          echo "lane=$LANE ref=$REF base=$BASE"
          python tests/ownership_check.py --lane "$LANE" --diff --base "$BASE"
      - name: Core Guard manifest verify
        run: python tests/core_guard.py

  # Wave 5H QA-1 (docs/audit-tasks/qa-security.md): dependency + secret +
  # SAST scanners. Suppression policy + regeneration commands:
  # tests/security/SCANNERS.md. Fails ONLY on real findings (baseline +
  # documented skips); existing OS jobs above are untouched.
  security-scanners:
    name: Security scanners (gitleaks / pip-audit / bandit / npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans git history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: gitleaks (default secrets + local user/path/IP rules, baseline-allow-listed)
        run: |
          curl -sSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          # --log-opts=HEAD: scan THIS branch's history only — matches the
          # single-branch checkout and keeps lane-side scans deterministic
          # (unmerged sibling branches must not redden this job)
          /tmp/gitleaks git --log-opts=HEAD --config .gitleaks.toml \
            --baseline-path tests/security/gitleaks-baseline.json
      - name: pip-audit (tests/requirements.txt)
        run: |
          python -m pip install -q pip-audit
          pip-audit -r tests/requirements.txt
      - name: bandit SAST — HIGH gate (documented skips B602/B324)
        run: |
          python -m pip install -q bandit
          bandit -r brain supervisor scripts tests body \
            -c tests/security/bandit.yaml --severity-level high
      - name: bandit report (medium+, non-gating visibility)
        if: always()
        run: |
          python -m pip install -q bandit
          bandit -r brain supervisor scripts tests body \
            -c tests/security/bandit.yaml -ll || true
      - name: npm audit (body/orb — critical gate; 2 documented highs in SCANNERS.md)
        working-directory: body/orb
        run: npm audit --audit-level=critical

  body-unit-windows:
    name: Windows — Body unit tests (no GUI)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install suite deps (no secrets)
        run: python -m pip install --upgrade pip; pip install -r tests/requirements.txt
      - name: Body unit tests (no GUI)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q tests/body_win
