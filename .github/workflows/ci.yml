# CI — mock suites only; secrets NEVER required (AGENT_RULES §7).
#
# ubuntu job  = brain suite + qa-security mock harness (contract, regression,
#               security, ownership) — everything runs against mocks, no
#               network providers, no GPU, no live stack.
# windows job = Body unit tests (lock/hotkey envelope) + conformance, no GUI.
#
# Local equivalent:  tests/run_all --with-brain   (Ubuntu)
#                    tests\run_all.ps1            (Windows)
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  brain-and-mocks:
    name: Ubuntu — brain + mock suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ownership checker diffs against the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install suite deps (no secrets)
        run: python -m pip install --upgrade pip && pip install -r tests/requirements.txt
      - name: qa-security mock suite (contract + regression + security + harness)
        # tests/run_all runs the documented root command:
        #   pytest -q tests supervisor/tests
        # supervisor/tests (infra, ~30 synthetic tests) is collected whenever
        # present — coord decision 2026-10-06 (infra APPROVED, qa-security
        # owns the timing); merge order puts infra's landing before ours, so
        # it exists at integration time.
        env:
          RAPHAEL_INSTANCE: qa-security
        run: tests/run_all
      - name: brain suite (brain/tests + brain/router/tests) on mocks
        env:
          RAPHAEL_INSTANCE: qa-security
        run: python -m pytest -q brain/tests brain/router/tests
      - name: ownership self-check (lane-derived vs OWNERSHIP.md)
        # Lane derivation (coord decision 2026-10-07 — hardcoding
        # `--lane qa-security` broke every non-qa push; evidence run
        # 37574556616 flagged PROGRESS.md/brain/router on a main push):
        #   - PR head / push ref = agent/<lane>  -> --lane <lane>  (per-lane gate)
        #   - main, integrator pushes, anything else -> --lane integrator
        #     (--lane integrator passes BY DESIGN: the integrator owns all
        #      merges; real per-lane enforcement runs in the integrator's
        #      merge loop per prompts/integrator_event.md)
        run: |
          REF="${{ github.head_ref || github.ref_name }}"
          case "$REF" in
            agent/*) LANE="${REF#agent/}" ;;
            *)       LANE="integrator" ;;
          esac
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            if [ "$REF" = "main" ]; then
              BASE="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
            else
              BASE="$(git merge-base HEAD origin/main 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
            fi
          fi
          echo "lane=$LANE ref=$REF base=$BASE"
          python tests/ownership_check.py --lane "$LANE" --diff --base "$BASE"
      - name: Core Guard manifest verify
        run: python tests/core_guard.py

  body-unit-windows:
    name: Windows — Body unit tests (no GUI)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install suite deps (no secrets)
        run: python -m pip install --upgrade pip; pip install -r tests/requirements.txt
      - name: Body unit tests + conformance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q tests/body_win tests/conformance
