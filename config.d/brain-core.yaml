# brain-core lane fragment (loader contract: docs/INTERFACES.md §c)
# Deep-merged over config.yaml — only THIS lane's knobs live here.
agent:
  max_tool_steps: 6            # tool-calling loop cap per job (call->execute->feed back)
  history_max_messages: 24     # multi-turn context: oldest user/assistant turns dropped first
  history_max_chars: 8000      # ...once the char budget is exceeded
  tool_result_max_chars: 4000  # single tool output fed back to the model (untrusted wrap on top)
  # streamed-sentence batching: OWNER CALL 2026-10-10 (Wave 5U P1) — kokoro
  # is the default engine and speaks the FIRST sentence as soon as it
  # completes; fish (clone tier) needed batching=2/1.5s (approved 2026-10-07)
  # — raise these again only when fish is the active engine.
  speak_batch_sentences: 1
  speak_batch_wait_s: 0

# Wave 5U task 7 — background task runtime (charter §5.1)
workers:
  max_background: 2          # concurrent kind='task' jobs (chat never queues behind them)
  stall_s: 90                # no task progress for this long -> stalled + Notice
