<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Raphael Orb</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        height: 100%;
        width: 100%;
        cursor: default;
        -webkit-user-select: none;
        user-select: none;
      }
      #subtitle {
        position: absolute;
        bottom: -40px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.95);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
        white-space: nowrap;
        max-width: 320px;
        text-shadow: 0 0 8px rgba(30, 59, 104, 0.8);
        transition: opacity 0.3s ease, bottom 0.3s ease;
        opacity: 0;
        pointer-events: none;
      }
      #subtitle.show {
        opacity: 1;
        bottom: 12px;
      }
      #subtitle.hide {
        opacity: 0;
        bottom: -40px;
      }
      #webgl {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="webgl"></canvas>
    <div id="subtitle"></div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
