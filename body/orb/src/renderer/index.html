<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Raphael Orb</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        height: 100%;
        width: 100%;
        cursor: default;
        -webkit-user-select: none;
        user-select: none;
      }
      #subtitle {
        position: absolute;
        bottom: -40px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.95);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
        white-space: nowrap;
        max-width: 320px;
        text-shadow: 0 0 8px rgba(30, 59, 104, 0.8);
        transition: opacity 0.3s ease, bottom 0.3s ease;
        opacity: 0;
        pointer-events: none;
      }
      /* `banner` = the Wave-5 answer/report cards (wrapped, not one line) */
      #subtitle.banner {
        white-space: normal;
        max-width: 264px;
        line-height: 1.35;
        font-size: 11.5px;
        background: rgba(12, 14, 20, 0.78);
        border: 1px solid rgba(167, 139, 250, 0.45);
        border-radius: 7px;
        padding: 5px 7px;
        box-sizing: border-box;
        left: 8px;
        transform: none;
        text-shadow: none;
      }
      #subtitle.show {
        opacity: 1;
        bottom: 12px;
      }
      #subtitle.hide {
        opacity: 0;
        bottom: -40px;
      }
      /* W2.3 typed input (TODO §3e): double-click opens this, Enter submits a
         PROTOCOL §3 `command` frame with source: orb. */
      #typed {
        position: absolute;
        left: 50%;
        bottom: -44px;
        transform: translateX(-50%);
        width: 240px;
        display: none;
        opacity: 0;
        transition: opacity 0.18s ease, bottom 0.18s ease;
        pointer-events: none;
      }
      #typed.show {
        display: block;
        opacity: 1;
        bottom: 6px;
        pointer-events: auto;
      }
      #typed input {
        width: 100%;
        box-sizing: border-box;
        background: rgba(14, 16, 22, 0.92);
        border: 1px solid rgba(45, 212, 191, 0.55);
        border-radius: 6px;
        color: #f2f4f8;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 13px;
        line-height: 1.3;
        padding: 6px 8px;
        outline: none;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.55);
      }
      #typed input:focus {
        border-color: rgba(45, 212, 191, 0.95);
      }
      #typed .hint {
        margin-top: 3px;
        font-size: 10px;
        color: rgba(226, 244, 255, 0.65);
        text-align: center;
        text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
      }
      /* WAVE 5U §5.6 task 1 (OWNER PRE-APPROVAL 3): a confirm card IS allowed on
         the orb, but ONLY while the orb is in the `confirm` state. This is the
         single documented exception to AMENDMENT 3 (no on-screen text) — every
         other text path stays behind ORB_TEXT_ENABLED=false. Hidden with
         display:none (not opacity) so document.body.innerText stays 0, which is
         exactly what the interaction gate asserts. */
      #confirmcard {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        display: none;
        box-sizing: border-box;
        padding: 7px 9px;
        border-radius: 9px;
        /* BUG 2 FIX: was rgba(12,14,20,0.9) — the orb's own amber wireframe
           bled THROUGH the 10% transparency and, sharing the border's hue, read
           as a giant diagonal X striking the card out ("looks locked/disabled").
           Opaque now, so the mesh can never show through it. The rectangular
           1px border is untouched — that was never the defect. */
        background: #0a0b0f;
        /* BUG 3 FIX: hard cap so long action/target/detail copy can never grow
           the panel up over the orb's centre (window centre = 50%). */
        max-height: 44%;
        overflow: hidden;
        border: 1px solid rgba(255, 176, 0, 0.65);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
        color: #f6f7fb;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 12px;
        line-height: 1.35;
        z-index: 4;
        pointer-events: auto;
      }
      #confirmcard.show { display: block; }
      #confirmcard .cc-head {
        font-weight: 600;
        margin-bottom: 3px;
        white-space: nowrap;              /* long action -> target clamps */
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #confirmcard .cc-risk {
        display: inline-block;
        margin-bottom: 3px;
        padding: 1px 6px;
        border-radius: 999px;
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: rgba(255, 176, 0, 0.18);
        border: 1px solid rgba(255, 176, 0, 0.7);
        color: #ffcf6b;
      }
      #confirmcard .cc-detail {
        color: rgba(246, 247, 251, 0.82);
        margin-bottom: 4px;
        display: -webkit-box;             /* clamp long detail to 2 lines */
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      /* badge + job share ONE row so the panel stays short */
      #confirmcard .cc-risk, #confirmcard .cc-job {
        display: inline-block;
        margin-right: 6px;
        vertical-align: middle;
      }
      #confirmcard .cc-job { color: rgba(246, 247, 251, 0.55); font-size: 10px; }
      #confirmcard .cc-actions { display: flex; gap: 8px; margin-top: 7px; }
      #confirmcard .cc-actions button {
        flex: 1;
        min-height: 32px;      /* 44px tap targets are the chat UI's bar (task 6) */
        border-radius: 7px;
        border: 1px solid transparent;
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      #confirmcard .cc-yes { background: rgba(255, 176, 0, 0.22); border-color: rgba(255, 176, 0, 0.85); color: #ffd98a; }
      #confirmcard .cc-no  { background: rgba(120, 130, 150, 0.18); border-color: rgba(150, 160, 180, 0.5); color: #dfe4ee; }
      #webgl {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="webgl"></canvas>
    <div id="subtitle"></div>
    <div id="typed">
      <input id="typedInput" type="text" maxlength="300"
             placeholder="Ask Raphael…" spellcheck="false" autocomplete="off" />
      <div class="hint">Enter to send · Esc to close</div>
    </div>
    <div id="confirmcard">
      <div class="cc-head"></div>
      <div class="cc-risk" hidden></div>
      <div class="cc-detail" hidden></div>
      <div class="cc-job" hidden></div>
      <div class="cc-actions">
        <button class="cc-yes" data-answer="yes">Approve</button>
        <button class="cc-no" data-answer="no">Deny</button>
      </div>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "../../node_modules/three/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
