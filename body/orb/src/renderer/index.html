<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Raphael Orb</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        height: 100%;
        width: 100%;
        cursor: default;
        -webkit-user-select: none;
        user-select: none;
      }
      #subtitle {
        position: absolute;
        bottom: -40px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.95);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
        white-space: nowrap;
        max-width: 320px;
        text-shadow: 0 0 8px rgba(30, 59, 104, 0.8);
        transition: opacity 0.3s ease, bottom 0.3s ease;
        opacity: 0;
        pointer-events: none;
      }
      /* `banner` = the Wave-5 answer/report cards (wrapped, not one line) */
      #subtitle.banner {
        white-space: normal;
        max-width: 264px;
        line-height: 1.35;
        font-size: 11.5px;
        background: rgba(12, 14, 20, 0.78);
        border: 1px solid rgba(167, 139, 250, 0.45);
        border-radius: 7px;
        padding: 5px 7px;
        box-sizing: border-box;
        left: 8px;
        transform: none;
        text-shadow: none;
      }
      #subtitle.show {
        opacity: 1;
        bottom: 12px;
      }
      #subtitle.hide {
        opacity: 0;
        bottom: -40px;
      }
      /* SEC-3 (Wave 5H): a CLEAR on-orb "mic audio is going to the cloud"
         indicator. Deliberately FAIL-SAFE: Private Mode is the only thing that
         provably stops cloud egress, so anything else warns.
         Placement is INSIDE the orb silhouette and sized in vw so it scales
         with the window — orb:size measures the radius containing 97% of lit
         pixels (test/orb-size.cjs:50), so a badge poking past the sphere would
         move that number. */
      #micbadge {
        position: absolute;
        bottom: 24%;
        left: 50%;
        transform: translateX(-50%);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 4.2vw;
        font-weight: 600;
        letter-spacing: 0.05em;
        line-height: 1;
        padding: 1.5vw 2.8vw;
        border-radius: 999px;
        background: rgba(116, 16, 20, 0.84);
        border: 1px solid rgba(255, 96, 96, 0.9);
        color: #ffe3e3;
        text-shadow: 0 0 6px rgba(0, 0, 0, 0.85);
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.22s ease;
        pointer-events: none;
        z-index: 3;
      }
      #micbadge.on {
        opacity: 1;
      }
      /* W2.3 typed input (TODO §3e): double-click opens this, Enter submits a
         PROTOCOL §3 `command` frame with source: orb. */
      #typed {
        position: absolute;
        left: 50%;
        bottom: -44px;
        transform: translateX(-50%);
        width: 240px;
        display: none;
        opacity: 0;
        transition: opacity 0.18s ease, bottom 0.18s ease;
        pointer-events: none;
      }
      #typed.show {
        display: block;
        opacity: 1;
        bottom: 6px;
        pointer-events: auto;
      }
      #typed input {
        width: 100%;
        box-sizing: border-box;
        background: rgba(14, 16, 22, 0.92);
        border: 1px solid rgba(45, 212, 191, 0.55);
        border-radius: 6px;
        color: #f2f4f8;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 13px;
        line-height: 1.3;
        padding: 6px 8px;
        outline: none;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.55);
      }
      #typed input:focus {
        border-color: rgba(45, 212, 191, 0.95);
      }
      #typed .hint {
        margin-top: 3px;
        font-size: 10px;
        color: rgba(226, 244, 255, 0.65);
        text-align: center;
        text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
      }
      #webgl {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="webgl"></canvas>
    <div id="subtitle"></div>
    <div id="micbadge" title="Microphone audio is being sent to the cloud STT">MIC → CLOUD</div>
    <div id="typed">
      <input id="typedInput" type="text" maxlength="300"
             placeholder="Ask Raphael…" spellcheck="false" autocomplete="off" />
      <div class="hint">Enter to send · Esc to close</div>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "../../node_modules/three/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
