<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Raphael Orb</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        height: 100%;
        width: 100%;
        cursor: default;
        -webkit-user-select: none;
        user-select: none;
      }
      #subtitle {
        position: absolute;
        bottom: -40px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.95);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
        white-space: nowrap;
        max-width: 320px;
        text-shadow: 0 0 8px rgba(30, 59, 104, 0.8);
        transition: opacity 0.3s ease, bottom 0.3s ease;
        opacity: 0;
        pointer-events: none;
      }
      #subtitle.show {
        opacity: 1;
        bottom: 12px;
      }
      #subtitle.hide {
        opacity: 0;
        bottom: -40px;
      }
      /* W2.3 typed input (TODO §3e): double-click opens this, Enter submits a
         PROTOCOL §3 `command` frame with source: orb. */
      #typed {
        position: absolute;
        left: 50%;
        bottom: -44px;
        transform: translateX(-50%);
        width: 240px;
        display: none;
        opacity: 0;
        transition: opacity 0.18s ease, bottom 0.18s ease;
        pointer-events: none;
      }
      #typed.show {
        display: block;
        opacity: 1;
        bottom: 6px;
        pointer-events: auto;
      }
      #typed input {
        width: 100%;
        box-sizing: border-box;
        background: rgba(14, 16, 22, 0.92);
        border: 1px solid rgba(45, 212, 191, 0.55);
        border-radius: 6px;
        color: #f2f4f8;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 13px;
        line-height: 1.3;
        padding: 6px 8px;
        outline: none;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.55);
      }
      #typed input:focus {
        border-color: rgba(45, 212, 191, 0.95);
      }
      #typed .hint {
        margin-top: 3px;
        font-size: 10px;
        color: rgba(226, 244, 255, 0.65);
        text-align: center;
        text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
      }
      #webgl {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="webgl"></canvas>
    <div id="subtitle"></div>
    <div id="typed">
      <input id="typedInput" type="text" maxlength="300"
             placeholder="Ask Raphael…" spellcheck="false" autocomplete="off" />
      <div class="hint">Enter to send · Esc to close</div>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "../../node_modules/three/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
