<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Raphael Orb</title>
<style>
body,html{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:transparent; color:#fff; font-family:sans-serif;}
#controls{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.5);padding:8px 10px;border-radius:5px;}
#controls label{display:block;margin-bottom:5px;}
#fps{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,0.5);padding:2px 5px;border-radius:3px;}
</style>
</head>
<body>
<div id="controls">
<label>State: <select id="stateSelect"></select></label>
</div>
<canvas id="webgl"></canvas>
<div id="fps">FPS: <span id="fpsVal">0</span></div>
<script type="importmap">
  {
    "imports": {
      "three": "../../node_modules/three/build/three.module.js"
    }
  }
</script>
<script type="module" src="renderer.js"></script>
<script>
window.__orbDemo = {
  setState: (s)=>{const el=document.getElementById('stateSelect'); if(el){el.value=s; el.dispatchEvent(new Event('change'));}},
  setSize: (sz)=>{window.orbDemoSize = sz;},
  setAmp: (a)=>{window.orbDemoAmp = a;},
  setBg: (b)=>{applyBg(b);},
  getState:()=>{const el=document.getElementById('stateSelect'); return el ? el.value : 'idle';},
};
const BG_STYLES = {transparent:'transparent', dark:'#222222', light:'#e9e9ef', busy:'repeating-conic-gradient(#7a7a7a 0% 25%, #b8b8b8 0% 50%) 0 0 / 48px 48px'};
function applyBg(v){ document.body.style.background = BG_STYLES[v] || 'transparent'; }
applyBg('transparent');
</script>

</body>
</html>
