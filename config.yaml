# ============================================================================
# Raphael runtime configuration  (integrator-owned)
# Schema: docs/ARCHITECTURE.md §6 · overlays: docs/INTERFACES.md §(c)
# NO secrets in this file — secrets live in .env and are never logged.
# ============================================================================

# --- Profile ---------------------------------------------------------------
# TEMPORARY PIVOT until the user's RAM upgrade (docs/WAVES.md Wave 6 cutover):
#   cloud_temp (CURRENT): NO local models anywhere (no Ollama, no local Whisper,
#     no local vision). LLMs are CLOUD-ONLY for near-instant responses
#     (AGENTS rule 15 / user 2026-10-07): opencode models own the chain, paid
#     fully authorized cost-is-no-factor (PAID_USAGE 2026-10-07), STT = Groq
#     Whisper, vision = cloud (PROTOCOL §7), TTS = local Fish-Speech with the
#     JP great-sage reference (user-mandated voice).
#   local (Wave 6): local-model cutover — see profiles: at the bottom.
# Local code paths stay in the repo in BOTH profiles. Never delete them.
profile: cloud_temp

# --- Server / supervisor / runtime -----------------------------------------
server:
  host: 127.0.0.1                         # loopback-only bind (PROTOCOL §1); token auth always mandatory (scripts/NETWORK-SECURITY.md)
  port: 8765                              # main instance; lanes derive ports from RAPHAEL_INSTANCE (INTERFACES §d)

supervisor:
  distro: Ubuntu-26.04
  wsl_user: dami                          # env RAPHAEL_WSL_USER overrides; keep explicit (Windows host cannot derive the Linux user) — ARCH-4
  brain_unit: raphael-brain
  health_interval_s: 5
  ws_url: ws://127.0.0.1:8765/ws

runtime_opencode:
  auto_permit: true                       # DEPRECATED by Wave 5U: becomes a per-skill allowlist before the coding skill ships (brain-core fleet runtime, P3)
  config_dir: ~/.raphael/runtime-opencode

# --- LLM chain / providers --------------------------------------------------
# USER 2026-10-07: opencode models own Raphael's LLM chain; cost is NOT a
# selection factor (PAID_USAGE "$56 for the month" — choose speed/quality,
# log spend as bookkeeping). Groq serves STT (Whisper) ONLY — its provider
# caps are {'stt'}, and chat paths require a chat/tools capability, so it can
# never answer an LLM turn (brain/router/groq.py + core.py capability require).
providers:
  chain: [go, zen_free, groq]               # OWNER-DECIDED 2026-10-10 (charter Q1: 'Go first, cloud profile'): go = opencode-go primary · zen_free = free fallback · groq = STT-only tail. (2026-10-09 zen-first reorder superseded; if go latency is poor at demo time, revisit WITH the owner via P0.8 metrics.)
  groq_base_url: https://api.groq.com/openai/v1   # GROQ_API_KEY from .env — never logged
  zen_base_url: https://opencode.ai/zen/v1
  go_base_url: https://opencode.ai/zen/go/v1
  allow_go_runtime: true                   # USER 2026-10-07 (broad paid approval, PAID_USAGE.md; Rule 15 speed)
  allow_paid_runtime: true                 # USER 2026-10-07 — opencode paid models own chat/tools; cost no longer a factor
  allow_vision_paid: true                  # USER APPROVAL 2026-10-06 "use the opencode go paid models for vision for now" — vision purpose; owner router lane
  vision_paid_daily_cap_usd: 1.00          # hard stop -> vision() refuses E_OFFLINE + coord attention (bookkeeping)
  allow_free_models_for_personal_data: false
  personal_ok: [go, ollama]                # Wave 5U P2: personal memory categories may enter prompts ONLY for these providers (never zen_free); redaction always on
  chat_daily_cap_usd: 0.50                 # Wave 5U runtime chat spend cap (owner-approved 2026-10-10); over cap -> zen_free/local + Notice once (router implements, P2)  # personal/sensitive-flagged content -> local model only (Wave 6)
  discovery_interval_s: 3600               # re-query /v1/models; vanishing model = re-select, never an error
  max_calls_per_minute: 12                 # concurrent-job guard
  benchmark_ranking_path: brain/router/benchmark_ranking.json

# --- Local models (WAVE 6 — OFF until the RAM upgrade) -----------------------
local_model:
  enabled: false                           # cloud_temp: never used, never started; profile local flips true
  # User-confirmed exclusions: 'slut' permanently excluded (no tool calling / vision).
  candidates: [qwen3.5:4b, qwen3.5:9b, qwen3:1.7b, huihui_ai/qwen3-vl-abliterated:4b-instruct]
  text: auto                               # picked by `raphael benchmark`; `raphael set-local-model <name>` overrides
  vision: auto                             # screenshots -> local only, ever
  keep_alive: 5m                           # resident text/router model
  vision_keep_alive: 0                     # vision unloads after use (8GB VRAM budget)
  max_concurrency: 1                       # VRAM: single local inference at a time
  ollama_url: http://127.0.0.1:11434

# --- Voice (TTS local fish-speech · STT cloud) --------------------------------
voice:
  stt_engine: groq                         # cloud_temp: Groq Whisper via router.transcribe(); profile local: faster-whisper (stt_model)
  stt_model: small                         # faster-whisper size (local profile)
  stt_device: auto
  stt_language: en                         # pinned 2026-10-07: auto-detect returned hangul for the wake word under the JP voice (live gate)
  tts_voice: assets/raphael_reference_jp.wav   # USER-MANDATED JP great-sage voice (2026-10-07); loud fail if missing, never a silent default
  tts_sample_rate: 24000
  wake_word: raphael
  ptt_hotkey: "ctrl+alt+space"             # used only when always_listen: false
  always_listen: true                      # wake-word streaming ("Raphael, ..."); false = push-to-talk
  ack_cache: assets/acks/                  # phrase cache is ref-sha1 namespaced (Bug D/H); legacy entries auto-swept
  tts_engine: kokoro                       # OWNER CALL 2026-10-10 (pre-approval updated): kokoro (local 82M, in-process) = DEFAULT; fish = optional JP-clone tier (voice.tiers) only. Cache namespaced per engine+voice.
  kokoro_voice: af_heart                   # default preset (calmest female per pre-approval); samples af_nicole/af_heart/af_bella in ~/.raphael/voice/eval/kokoro_samples/ — owner may switch by name
  kokoro_speed: 1.0                        # kokoro create() speed (0.5-2.0); CPU RTF ~0.3
  kokoro_model: brain/voice/models/kokoro/kokoro-v1.0.onnx    # gitignored (~310MB) — download_kokoro_weights.sh
  kokoro_voices: brain/voice/models/kokoro/voices-v1.0.bin    # gitignored (~27MB)  — download_kokoro_weights.sh
  tier_fish:                               # P2 (Wave 5P): warmth -> fish sampling (persona.tiers[].warmth)
    baseline: 0.2                          # warmth 0.0 (great_sage): measured P0 battery 10/10
    scale: 0.33                            # temperature = baseline + scale * warmth (raphael 0.3 -> ~0.30, ciel 0.6 -> ~0.40)
    cap: 0.45                              # hard ceiling (P0 drift measured 2/10 at 0.7 pre-fix — never go near)
    repetition_penalty: 1.2                # A/B'd 2026-10-08 (RP1.3 measured worse); tier-independent for now

voice_personality:
  character: raphael_great_sage            # Tensei Slime's Great Sage — NOT Jarvis (addendum §10)
  gender: female                           # Raphael is a SHE — female anime-authentic voice; she/her in all prompts/docs
  style: calm, precise, analytical, emotionless-but-devoted
  speech_forms:                            # canonical reply shapes
    - "Understood. Executing now."
    - "Confirmed."
    - "Analysis complete."
    - "Task complete."
    - "That failure was within expectations. Adjusting."
  banned: [sir, certainly sir, as you wish, playful banter, jokes, butler flattery]
  spoken_reply_max_sentences: 2            # long details go on screen (never synthesize unheard audio)
  proactive_warnings: actionable_only      # silent background analysis; surface only what matters
  greeting: "Raphael online."
  greeting_recovered: "Raphael online. Recovered from an unexpected shutdown — interrupted tasks are listed."

# --- Jobs / concurrency -------------------------------------------------------
jobs:
  max_concurrent: 8
  gui_steps_cap: 25                        # computer-use loop step limit
  local_concurrency: 1
  confirm_timeout_s: 30                    # timeout -> ABORT, never auto-approve

# --- Safety (enforced in code, brain/confirm.py) -------------------------------
safety:
  confirm_actions:                         # per-job confirmation gate
    - delete_files
    - send_message
    - send_email
    - purchase
    - enter_password
    - system_settings_change
    - install_software
    - make_public_repo
    - open_arbitrary_file                   # Wave 5P/P3 + AUD-11 (config-confirm-categories)
    - gui_submission                        # Wave 5P/P3 + AUD-11 (config-confirm-categories)
    - send_email                            # Wave 5U P0.3: typed/click confirm class
    - account_login
    - enter_password                        # already present historically; kept explicit
    - purchase
    - delete_files                          # (dup of list head — kept as the named class anchor)
  typed_confirm:                            # Wave 5U P0.3: voice YES rejected for these classes;
                                           # typed text or an on-screen card click required
    - send_email
    - account_login
    - enter_password
    - purchase
    - make_public_repo
  confirm_policy:                          # Wave 5P P3 — user-editable act/confirm map.
    # Canon (docs/research/persona/00-CONSOLIDATED-BRIEF.md §3): act-first-and-report
    # for unambiguous reversible intent; confirm-first for irreversible, destructive,
    # or personal-domain acts; never destroy a resource silently.
    default: confirm
    classes:
      delete_files: confirm
      send_message: confirm
      send_email: confirm
      purchase: confirm
      enter_password: confirm
      system_settings_change: confirm
      install_software: confirm
      make_public_repo: confirm
      open_arbitrary_file: confirm
      gui_submission: confirm
      files_write: auto                    # reversible local writes: act-first-and-report
      web_fetch: auto                      # read-only
      # Wave 5U additions (tools-memory request wave5u-confirm-classes, approved 2026-10-10)
      read_only: auto                      # file_read/search, shell_list, github_status, mcp_list, schedule readers
      schedule: auto                       # timers/reminders/schedule writers (reversible local)
      send_email: confirm                  # (added 2026-10-10: was in confirm_actions but missing from classes — qa PENDING ledger)
      account_login: confirm               # (same)
      system_command: confirm              # shell
      web_publish: confirm                 # github_push / publishing
      mcp_tool: confirm                    # MCP wrapped tools + mcp_refresh (spawn)
    # edits to this map must go through a confirmed act (self-protecting)
  failsafe_corner: true                    # pyautogui mouse-to-corner
  kill_switch_hotkey: "ctrl+alt+shift+k"
  pause_persist: true
  pause_hotkey: "ctrl+alt+p"               # control: pause/resume toggle (persisted)
  private_hotkey: "ctrl+alt+shift+p"       # control: private_on/off toggle (persisted)


# --- Persona (Wave 5P — active 2026-10-09) --------------------------------
persona:
  tier: raphael                            # great_sage | raphael | ciel — growth, not replacement
  # prompts authored by evolution-persona from docs/research/persona/00-CONSOLIDATED-BRIEF.md
  # (debunk register binding; a lint test forbids refuted strings in persona assets)
  tiers:
    great_sage: { warmth: 0.0, address: none,    prompt: docs/evolution/persona/tier-great-sage.md }
    raphael:    { warmth: 0.3, address: master,  prompt: docs/evolution/persona/tier-raphael.md }
    ciel:       { warmth: 0.6, address: master,  prompt: docs/evolution/persona/tier-ciel.md }

# --- Privacy -------------------------------------------------------------------
privacy:
  watch_mode: false                        # proactive screen sampling OFF by default
  debug_capture: false                     # no screenshot/sensitive logging unless enabled
  blocklist_apps: [1Password, KeePass, Bitwarden, Banking]   # matched foreground -> local models only
  redact: [api_key, token, password, card, email, phone]

# --- Vision (cloud, PROTOCOL §7 — TEMPORARY until RAM upgrade) ------------------
vision:
  provider: cloud                          # cloud_temp ONLY: cloud vision. profile local: local Ollama, never cloud.
  max_px: 1280                             # downscale BEFORE any cloud send
  quality: 70
  # Pre-send gates (code-enforced): privacy.blocklist_apps foreground check,
  # privacy.redact scrubbing, NO image logging/persistence (debug_capture false).
  # Private Mode disables ALL model calls (LLM + vision) -> fastpath only.

# --- GitHub ----------------------------------------------------------------------
github:
  default_visibility: private
  auto_public: false                       # true = Raphael may create public repos without asking

# --- Orb (the on-screen sphere) ----------------------------------------------------
orb:
  reference_dir: assets/orb-reference      # user-provided Tensura art + DESCRIPTIONS.md art brief
  renderer: threejs                        # 3D WebGL (not flat canvas)
  size_px: 280                             # WINDOW box size (fixed; allowed 160-600)
  content_px: 200                          # rendered orb size (user: box 280, content 200 -> edge-safe margin)
  opacity: 0.95
  fps_cap: 60
  quality: auto                            # auto|low|medium|high — auto tiers (rebuild spec §5)
  backing_disc_alpha: 0.25                 # soft legibility disc alpha; 0 disables (spec §4)
  reduced_motion: false                    # accessibility: damp/limit motion (spec §6)
  roam: false                              # PINNED (user): dock top-right; roam = explicit opt-in
  rest_motion: revolve                     # at rest = slow spin/revolve + breathing
  speak_pulse: [amplitude, pitch]          # pulsate per word/pitch during TTS
  morph_duration_ms: 600
  # task kind -> morph target polygon. HELD (user 2026-10-07): shape-changing is
  # RESERVED for future plans — the renderer holds a constant wireframe-sphere
  # cage and brain sends circle-only hints; entries below are the future
  # re-enable map (approvals kept).
  shape_map:
    system: triangle                       # volume, brightness, windows, timers, media
    files: square                          # files, folders, shell, downloads
    web: pentagon                          # URLs, search, fetch/summarize
    media: hexagon                         # music/video playback
    llm: octagram                          # reasoning/research — signature shape
    gui: circle                            # computer-use (calm, precise)
    analysis: octagram                     # deep reasoning (approved 2026-10-07)
    simulation: triangle                   # dry-run/rehearsal (approved 2026-10-07)
    none: circle                           # default / idle / speaking base

# --- Profile overlays — deep-merged per docs/INTERFACES.md §(c) -------------------
# Base values above ALREADY reflect profile cloud_temp (its overlay is a no-op);
# profile local is the Wave 6 cutover and keeps Go/paid GATED regardless of base.
profiles:
  cloud_temp: {}
  local:
    profile: local
    providers: { chain: [zen_free, go, ollama], allow_go_runtime: false, allow_paid_runtime: false }
    local_model: { enabled: true }
    voice: { stt_engine: local }
    vision: { provider: local }
  # ARCH-5 dormant presets (integrator-approved 2026-10-08 — router request
  # arch5-router-contribution; brain-core co-share). `cloud` = today's chain
  # under a real name. `hybrid` is INACTIVE by selection only and stays
  # gated by the human cloud-only/RAM decision (WAVES cloud_temp constraint)
  # — do not select it until the user lifts that gate.
  cloud:
    profile: cloud
    providers: { chain: [go, zen_free, groq], allow_go_runtime: true, allow_paid_runtime: true }
    local_model: { enabled: false }
    voice: { stt_engine: groq }
    vision: { provider: cloud }
  hybrid:
    profile: hybrid
    providers: { chain: [go, zen_free, groq, ollama], allow_go_runtime: true, allow_paid_runtime: true }
    local_model: { enabled: true }
    voice: { stt_engine: groq }
    vision: { provider: local }
